                                </p>
                                
                                <div className="space-y-2 mb-4">
                                    {tricks
                                        .filter(t => t.id !== selectedTrick.id)
                                        .map(trick => {
                                            const isRequired = selectedTrick.requiredTricks && selectedTrick.requiredTricks.includes(trick.id);
                                            return (
                                                <div
                                                    key={trick.id}
                                                    className="flex items-center bg-gray-50 p-3 rounded-lg hover:bg-gray-100 transition cursor-pointer"
                                                    onClick={() => {
                                                        const currentRequired = selectedTrick.requiredTricks || [];
                                                        const newRequired = isRequired
                                                            ? currentRequired.filter(id => id !== trick.id)
                                                            : [...currentRequired, trick.id];
                                                        updateRequiredTricks(selectedTrick.id, newRequired);
                                                    }}
                                                >
                                                    <input
                                                        type="checkbox"
                                                        checked={isRequired}
                                                        onChange={() => {}}
                                                        className="w-5 h-5 text-purple-600 rounded cursor-pointer"
                                                    />
                                                    <span className="ml-3 flex-1 text-gray-700">
                                                        {trick.name}
                                                    </span>
                                                    <span className={`text-xs px-2 py-1 rounded ${
                                                        trick.learningStatus === 'appris' ? 'bg-green-100 text-green-700' :
                                                        trick.learningStatus === 'en_cours' ? 'bg-blue-100 text-blue-700' :
                                                        'bg-gray-100 text-gray-700'
                                                    }`}>
                                                        {trick.learningStatus === 'appris' ? 'Appris' :
                                                         trick.learningStatus === 'en_cours' ? 'En cours' :
                                                         'Non appris'}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                </div>

                                <button
                                    onClick={() => setShowRequiredTricksModal(false)}
                                    className="w-full bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"
                                >
                                    Fermer
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add Trick */}
                    {showAddTrick && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full max-h-[80vh] overflow-y-auto">
                                <h3 className="text-xl font-bold text-gray-800 mb-4">Nouveau tour</h3>
                                <input
                                    type="text"
                                    placeholder="Nom du tour (ex: Assis, Couché...)"
                                    value={newTrickName}
                                    onChange={(e) => setNewTrickName(e.target.value)}
                                    className="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />

                                <div className="mb-4">

                                                    placeholder={`Objectif ${index + 1}`}
                                                    value={subgoal}
                                                    onChange={(e) => updateInitialSubgoal(index, e.target.value)}

                                                    <button
                                                        onClick={() => removeInitialSubgoalField(index)}
                                                        className="text-red-500 hover:text-red-700 px-2"

                                                        ✕
                                                    </button>

                                        ))}

                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full max-h-[80vh] overflow-y-auto">
                                <h3 className="text-xl font-bold text-gray-800 mb-4">Nouvel exercice d'auto-contrôle</h3>
                                <input
                                    type="text"
                                    placeholder="Nom de l'exercice (ex: Attendre devant la porte...)"
                                    value={newExerciseName}
                                    onChange={(e) => setNewExerciseName(e.target.value)}
                                    className="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />

                                <div className="mb-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="text-sm font-medium text-gray-700">Tâches initiales (optionnel)</label>
                                        <button
                                            onClick={addInitialSubgoalField}
                                            className="text-purple-600 hover:text-purple-800 text-sm font-medium"
                                        >
                                            + Ajouter une tâche
                                        </button>
                                    </div>
                                    <div className="space-y-2">
                                        {initialSubgoals.map((subgoal, index) => (
                                            <div key={index} className="flex gap-2">
                                                <input
                                                    type="text"
                                                    placeholder={`Tâche ${index + 1}`}
                                                    value={subgoal}
                                                    onChange={(e) => updateInitialSubgoal(index, e.target.value)}
                                                    className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                />
                                                {initialSubgoals.length > 1 && (
                                                    <button
                                                        onClick={() => removeInitialSubgoalField(index)}
                                                        className="text-red-500 hover:text-red-700 px-2"
                                                    >
                                                        ✕
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    <button
                                        onClick={() => {
                                            setShowAddExercise(false);
                                            setInitialSubgoals(['']);
                                        }}
                                        className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition"
                                    >
                                        Annuler
                                    </button>
                                    <button
                                        onClick={addExercise}
                                        className="flex-1 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"
                                    >
                                        Ajouter
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add Subgoal */}
                    {showAddSubgoal && (selectedTrick || selectedExercise) && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full">
                                <h3 className="text-xl font-bold text-gray-800 mb-4">
                                    {addingSubgoalToParent ? 'Nouvelle sous-tâche' : (selectedExercise ? 'Nouvelle tâche' : 'Nouvel objectif')}
                                </h3>
                                {addingSubgoalToParent && (
                                    <p className="text-sm text-gray-500 mb-3">
                                        ↳ Sera ajoutée comme sous-tâche
                                    </p>
                                )}
                                <input
                                    type="text"
                                    placeholder={addingSubgoalToParent ? "Ex: Maintenir 5 secondes" : "Ex: Réagir au signal vocal"}
                                    value={newSubgoalName}
                                    onChange={(e) => setNewSubgoalName(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter') {
                                            if (selectedExercise) {
                                                addSubgoal(selectedExercise.id, addingSubgoalToParent, true);
                                            } else {
                                                addSubgoal(selectedTrick.id, addingSubgoalToParent, false);
                                            }
                                        }
                                    }}
                                    className="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    autoFocus
                                />
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => {
                                            setShowAddSubgoal(false);
                                            setAddingSubgoalToParent(null);
                                            setNewSubgoalName('');
                                        }}
                                        className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition"
                                    >
                                        Annuler
                                    </button>
                                    <button
                                        onClick={() => {
                                            if (selectedExercise) {
                                                addSubgoal(selectedExercise.id, addingSubgoalToParent, true);
                                            } else {
                                                addSubgoal(selectedTrick.id, addingSubgoalToParent, false);
                                            }
                                        }}
                                        className="flex-1 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"
                                    >
                                        Ajouter
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Session */}
                    {showSession && generatedSession && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full max-h-[80vh] overflow-y-auto">
                                {!sessionInProgress ? (
                                    // Écran de démarrage
                                    <>
                                        <h3 className="text-xl font-bold text-gray-800 mb-4">
                                            {generatedSession.message}
                                        </h3>
                                        
                                        {generatedSession.tasks.length === 0 ? (
                                            <>
                                                <p className="text-gray-600 mb-4">
                                                    Aucun tour à travailler ! 🎉
                                                </p>
                                                <button
                                                    onClick={() => setShowSession(false)}
                                                    className="w-full bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"
                                                >
                                                    Fermer
                                                </button>
                                            </>
                                        ) : (
                                            <>
                                                <div className="space-y-3 mb-4">
                                                    {generatedSession.tasks.map((task, index) => (
                                                        <div key={index} className="border border-gray-200 rounded-lg p-4">
                                                            <div className="flex items-start justify-between mb-2">
                                                                <div className="flex-1">
                                                                    <div className="flex items-center gap-2 mb-1">
                                                                        <h4 className="font-semibold text-gray-800">
                                                                            {index + 1}. {task.type === 'self_control' ? `🧘 ${task.exerciseName}` : task.trickName}
                                                                        </h4>
                                                                    </div>
                                                                    <div className="text-sm text-gray-600 mt-2">
                                                                        {task.type === 'trick_learning' ? (
                                                                            <div className="bg-blue-50 border border-blue-200 rounded p-2">
                                                                                <span className="font-medium">🎯 Apprentissage du tour</span>
                                                                                <p className="text-xs mt-1">Travaillez les bases du tour jusqu'à ce que votre chien comprenne le principe</p>
                                                                            </div>
                                                                        ) : task.type === 'self_control' ? (
                                                                            <>
                                                                                <div className="bg-green-50 border border-green-200 rounded p-2 mb-2">
                                                                                    <span className="font-medium">🧘 Exercice d'auto-contrôle</span>
                                                                                </div>
                                                                                <span className="font-medium">Tâche à travailler:</span>
                                                                                <div className="ml-3 mt-1">
                                                                                    {task.pathNames.map((pathName, idx) => (
                                                                                        <div key={idx} className={`${idx > 0 ? 'ml-4' : ''} text-gray-700`}>
                                                                                            {idx > 0 && '↳ '}
                                                                                            {pathName}
                                                                                            {idx === task.pathNames.length - 1 && (
                                                                                                <span className="ml-2 text-purple-600 font-semibold">← À pratiquer</span>
                                                                                            )}
                                                                                        </div>
                                                                                    ))}
                                                                                </div>
                                                                            </>
                                                                        ) : (
                                                                            <>
                                                                                <span className="font-medium">Objectif à travailler:</span>
                                                                                <div className="ml-3 mt-1">
                                                                                    {task.pathNames.map((pathName, idx) => (
                                                                                        <div key={idx} className={`${idx > 0 ? 'ml-4' : ''} text-gray-700`}>
                                                                                            {idx > 0 && '↳ '}
                                                                                            {pathName}
                                                                                            {idx === task.pathNames.length - 1 && (
                                                                                                <span className="ml-2 text-purple-600 font-semibold">← À pratiquer</span>
                                                                                            )}
                                                                                        </div>
                                                                                    ))}
                                                                                </div>
                                                                            </>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
                                                    <p className="text-sm text-gray-700">
                                                        💡 <strong>Conseil:</strong> Terminez chaque exercice sur une réussite et récompensez généreusement !
                                                    </p>
                                                </div>

                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => setShowSession(false)}
                                                        className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition"
                                                    >
                                                        Annuler
                                                    </button>
                                                    <button
                                                        onClick={() => setSessionInProgress(true)}
                                                        className="flex-1 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"
                                                    >
                                                        Commencer
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                    </>
                                ) : (
                                    // Écran de validation des résultats
                                    <>
                                        <h3 className="text-xl font-bold text-gray-800 mb-4">
                                            ✅ Valider les résultats
                                        </h3>
                                        
                                        <p className="text-gray-600 mb-4">
                                            Cochez les objectifs que votre chien a réussis :
                                        </p>

                                        <div className="space-y-2 mb-4">
                                            {sessionResults.map((result, index) => (
                                                <div
                                                    key={index}
                                                    className="bg-gray-50 p-3 rounded-lg hover:bg-gray-100 transition"
                                                >
                                                    <div 
                                                        className="flex items-start cursor-pointer"
                                                        onClick={() => toggleSessionResult(index)}
                                                    >
                                                        <input
                                                            type="checkbox"
                                                            checked={result.completed}
                                                            onChange={() => toggleSessionResult(index)}
                                                            className="w-5 h-5 text-purple-600 rounded cursor-pointer mt-1 flex-shrink-0"
                                                            onClick={(e) => e.stopPropagation()}
                                                        />
                                                        <div className="ml-3 flex-1">
                                                            <div className="font-medium text-gray-800 mb-1">
                                                                {result.type === 'self_control' ? `🧘 ${result.exerciseName}` : result.trickName}
                                                            </div>
                                                            {result.type === 'trick_learning' ? (
                                                                <div className="text-sm bg-blue-50 border border-blue-200 rounded p-2">
                                                                    <span className={result.completed ? 'line-through text-gray-400' : 'text-blue-700 font-medium'}>
                                                                        🎯 Apprentissage du tour
                                                                    </span>
                                                                </div>
                                                            ) : result.type === 'self_control' ? (
                                                                <div className="text-sm text-gray-600">
                                                                    <div className="bg-green-50 border border-green-200 rounded p-2 mb-1">
                                                                        <span className="text-green-700 font-medium text-xs">Auto-contrôle</span>
                                                                    </div>
                                                                    {result.pathNames.map((pathName, idx) => (
                                                                        <div key={idx} className={`${idx > 0 ? 'ml-4' : ''}`}>
                                                                            {idx > 0 && '↳ '}
                                                                            <span className={idx === result.pathNames.length - 1 ? (result.completed ? 'line-through text-gray-400' : 'text-gray-700 font-medium') : 'text-gray-600'}>
                                                                                {pathName}
                                                                            </span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            ) : (
                                                                <div className="text-sm text-gray-600">
                                                                    {result.pathNames.map((pathName, idx) => (
                                                                        <div key={idx} className={`${idx > 0 ? 'ml-4' : ''}`}>
                                                                            {idx > 0 && '↳ '}
                                                                            <span className={idx === result.pathNames.length - 1 ? (result.completed ? 'line-through text-gray-400' : 'text-gray-700 font-medium') : 'text-gray-600'}>
                                                                                {pathName}
                                                                            </span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                                            <p className="text-sm text-gray-700">
                                                🎉 <strong>Bravo !</strong> Les objectifs cochés seront marqués comme acquis.
                                            </p>
                                        </div>

                                        <div className="flex gap-2">
                                            <button
                                                onClick={cancelSession}
                                                className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition"
                                            >
                                                Annuler
                                            </button>
                                            <button
                                                onClick={finishSession}
                                                className="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition"
                                            >
                                                Terminer
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
