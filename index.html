<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── Supabase ───────────────────────────────────────────────────────────────
        const SUPABASE_URL = 'https://csfxvyvsxbxhoikqxrdc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzZnh2eXZzeGJ4aG9pa3F4cmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MTIxMDYsImV4cCI6MjA4ODQ4ODEwNn0.kmRrHpYLHZQXqb6sXraZ6ZZTbhYv7zI_R_GvN4lFLOQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ─── Écran de connexion ──────────────────────────────────────────────────────
        function LoginScreen({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async () => {
                setError('');
                setLoading(true);
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                setLoading(false);
                if (error) {
                    setError('Email ou mot de passe incorrect.');
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
                        <div className="text-center mb-8">
                            <div className="text-6xl mb-3">🐕</div>
                            <h1 className="text-2xl font-bold text-gray-800">Suivi Éducation Canine</h1>
                            <p className="text-gray-500 text-sm mt-1">Connectez-vous pour accéder à vos données</p>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                    className="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-400"
                                    placeholder="votre@email.com"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                    className="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-400"
                                    placeholder="••••••••"
                                />
                            </div>
                            {error && <p className="text-red-500 text-sm">{error}</p>}
                            <button
                                onClick={handleLogin}
                                disabled={loading}
                                className="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition font-semibold disabled:opacity-50"
                            >
                                {loading ? 'Connexion...' : 'Se connecter'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ─── Application principale ──────────────────────────────────────────────────
        function App() {
            const [session, setSession] = useState(undefined); // undefined = chargement

            useEffect(() => {
                supabase.auth.getSession().then(({ data }) => {
                    setSession(data.session);
                });
                const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                });
                return () => listener.subscription.unsubscribe();
            }, []);

            if (session === undefined) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-gray-400 text-lg">Chargement...</div>
                    </div>
                );
            }
            if (!session) return <LoginScreen />;
            return <DogTrainingApp userId={session.user.id} userEmail={session.user.email} />;
        }

        function DogTrainingApp({ userId, userEmail }) {
            const [tricks, setTricks] = useState([]);
            const [selfControlExercises, setSelfControlExercises] = useState([]);
            const [activeView, setActiveView] = useState('dashboard');
            const [selectedTrick, setSelectedTrick] = useState(null);
            const [selectedExercise, setSelectedExercise] = useState(null);
            const [showAddTrick, setShowAddTrick] = useState(false);
            const [showAddExercise, setShowAddExercise] = useState(false);
            const [showAddSubgoal, setShowAddSubgoal] = useState(false);
            const [showSession, setShowSession] = useState(false);
            const [generatedSession, setGeneratedSession] = useState(null);
            const [addingSubgoalToParent, setAddingSubgoalToParent] = useState(null);
            const [editingSubgoal, setEditingSubgoal] = useState(null);
            const [editingText, setEditingText] = useState('');
            const [expandedSubgoals, setExpandedSubgoals] = useState({});
            const [sessionInProgress, setSessionInProgress] = useState(false);
            const [sessionResults, setSessionResults] = useState([]);
            const [draggedItem, setDraggedItem] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [showEditMenu, setShowEditMenu] = useState(false);
            const [showRequiredTricksModal, setShowRequiredTricksModal] = useState(false);
            const [scrollPositions, setScrollPositions] = useState({});
            const [dbLoading, setDbLoading] = useState(true);
            const saveTimeoutRef = useRef(null);

            // Formulaires
            const [newTrickName, setNewTrickName] = useState('');
            const [newExerciseName, setNewExerciseName] = useState('');
            const [newSubgoalName, setNewSubgoalName] = useState('');
            const [initialSubgoals, setInitialSubgoals] = useState(['']);

            // ── Chargement initial depuis Supabase ──────────────────────────────────
            useEffect(() => {
                const loadData = async () => {
                    setDbLoading(true);
                    const { data, error } = await supabase
                        .from('dog_training_data')
                        .select('tricks, self_control_exercises')
                        .eq('user_id', userId)
                        .single();

                    if (data) {
                        setTricks(data.tricks || []);
                        setSelfControlExercises(data.self_control_exercises || []);
                    }
                    setDbLoading(false);
                };
                loadData();
            }, [userId]);

            // ── Sauvegarde automatique dans Supabase (debounce 1s) ─────────────────
            const saveToSupabase = useCallback(async (newTricks, newExercises) => {
                await supabase
                    .from('dog_training_data')
                    .upsert({ user_id: userId, tricks: newTricks, self_control_exercises: newExercises }, { onConflict: 'user_id' });
            }, [userId]);

            useEffect(() => {
                if (dbLoading) return;
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => {
                    saveToSupabase(tricks, selfControlExercises);
                }, 800);
                // Mettre à jour selectedTrick si elle existe toujours
                if (selectedTrick) {

            const addSubgoalToPath = (subgoals, path, newSubgoal) => {
                return subgoals.map((subgoal) => {
                    if (subgoal.id === path[0]) {
                        if (path.length === 1) {
                            // On a trouvé le parent
                            return {
                                ...subgoal,
                                children: [...(subgoal.children || []), newSubgoal]
                            };
                        } else {
                            // Continuer à chercher dans les enfants
                            return {
                                ...subgoal,
                                children: addSubgoalToPath(subgoal.children || [], path.slice(1), newSubgoal)
                            };
                        }
                    }
                    return subgoal;
                });
            };

            const updateSubgoalInPath = (subgoals, path, updates) => {
                return subgoals.map((subgoal) => {
                    if (subgoal.id === path[0]) {
                        if (path.length === 1) {
                            return { ...subgoal, ...updates };
                        } else {
                            return {
                                ...subgoal,
                                children: updateSubgoalInPath(subgoal.children || [], path.slice(1), updates)
                            };
                        }
                    }
                    return subgoal;

            const deleteSubgoalInPath = (subgoals, path) => {
                if (path.length === 1) {
                    return subgoals.filter(s => s.id !== path[0]);
                }
                return subgoals.map(subgoal => {
                    if (subgoal.id === path[0]) {

            const cancelEditSubgoal = () => {

            const toggleExpanded = (path) => {

                }));

            const isExpanded = (path) => {

                return expandedSubgoals[key] || false;

            // Collecter toutes les tâches "leaf" (sans enfants) dans l'ordre
            const collectLeafTasks = (subgoals, path = []) => {
                let leaves = [];
                subgoals.forEach(subgoal => {
                    const currentPath = [...path, subgoal.id];
                    if (!subgoal.children || subgoal.children.length === 0) {
                        leaves.push({
                            ...subgoal,
                            path: currentPath
                        });
                    } else {
                        leaves = [...leaves, ...collectLeafTasks(subgoal.children, currentPath)];
                    }
                });
                return leaves;
            };

            // Obtenir les objectifs de niveau racine (deuxième niveau) avec leurs sous-tâches
            const getRootObjectives = (subgoals) => {
                return subgoals.map(objective => {
                    const allSubtasks = collectLeafTasks(objective.children || [], [objective.id]);
                    const incompleteSubtasks = allSubtasks.filter(task => !task.completed);
                    
                    return {
                        objective: objective,
                        incompleteSubtasks: incompleteSubtasks,
                        hasIncomplete: incompleteSubtasks.length > 0
                    };
                }).filter(obj => obj.hasIncomplete);
            };

            const reorderSubgoals = (trickId, parentPath, fromIndex, toIndex) => {
                setTricks(tricks.map(trick => {

                        if (parentPath === null) {
                            // Réorganiser au niveau racine
                            const newSubgoals = [...trick.subgoals];
                            const [moved] = newSubgoals.splice(fromIndex, 1);
                            newSubgoals.splice(toIndex, 0, moved);
                            return { ...trick, subgoals: newSubgoals };
                        } else {
                            // Réorganiser dans un parent spécifique
                            return {
                                ...trick,
                                subgoals: reorderInPath(trick.subgoals, parentPath, fromIndex, toIndex)
                            };
                        }
                    }
                    return trick;

                return subgoals.map(subgoal => {

                            const newChildren = [...(subgoal.children || [])];
                            const [moved] = newChildren.splice(fromIndex, 1);
                            newChildren.splice(toIndex, 0, moved);
                            return { ...subgoal, children: newChildren };
                        } else {

                            };

            const toggleSubgoalInPath = (subgoals, path) => {

            // Auto-cocher les parents si tous les enfants sont complétés
            const autoCheckParents = (subgoals) => {

                        const updatedChildren = autoCheckParents(subgoal.children);
                        const allChildrenCompleted = updatedChildren.every(child => child.completed);
                        return {

                    }

                });

            const deleteSubgoal = (trickId, path) => {
                setTricks(tricks.map(trick => {

            const deleteTrick = (trickId) => {

            const duplicateTrick = (trickId) => {

            const startEditTrickName = () => {

                    if (newName && newName.trim()) {

            const countAllSubgoals = (subgoals) => {
                let count = 0;
                subgoals.forEach(subgoal => {
                    count++;
                    if (subgoal.children && subgoal.children.length > 0) {
                        count += countAllSubgoals(subgoal.children);
                    }

                return count;

            const countCompletedSubgoals = (subgoals) => {
                let count = 0;
                subgoals.forEach(subgoal => {
                    if (subgoal.completed) count++;
                    if (subgoal.children && subgoal.children.length > 0) {
                        count += countCompletedSubgoals(subgoal.children);

                });
                return count;

            const calculateProgress = (trick) => {
                const total = countAllSubgoals(trick.subgoals);
                if (total === 0) return 0;
                const completed = countCompletedSubgoals(trick.subgoals);
                return Math.round((completed / total) * 100);
            };

            const canLearnTrick = (trick) => {
                if (!trick.requiredTricks || trick.requiredTricks.length === 0) {

                }
                
                // Vérifier que tous les tours requis sont appris

            // Fonctions spécifiques aux exercices d'auto-contrôle
            const toggleExerciseSubgoal = (exerciseId, path) => {

            const reorderExerciseSubgoals = (exerciseId, parentPath, fromIndex, toIndex) => {
                setSelfControlExercises(selfControlExercises.map(exercise => {

                            const [moved] = newSubgoals.splice(fromIndex, 1);
                            newSubgoals.splice(toIndex, 0, moved);
                            return { ...exercise, subgoals: newSubgoals };
                        } else {
                            return {
                                ...exercise,
                                subgoals: reorderInPath(exercise.subgoals, parentPath, fromIndex, toIndex)
                            };
                        }
                    }
                    return exercise;
                }));
            };

            const pathsMatch = (path1, path2) => {
                if (!path1 || !path2) return false;
                if (path1.length !== path2.length) return false;
                return path1.every((id, index) => id === path2[index]);
            };

            const generateSession = () => {
                const tricksInProgress = tricks.filter(t => t.learningStatus === 'en_cours');
                const tricksNotStarted = tricks.filter(t => t.learningStatus === 'non_appris');
                const tricksLearned = tricks.filter(t => t.learningStatus === 'appris');

                const tasksToWork = [];

                // 1. Ajouter un tour à apprendre (priorité: en cours > tours avec dépendances satisfaites)
                let trickToLearn = null;
                
                if (tricksInProgress.length > 0) {
                    // Plusieurs tours en cours : en choisir un au hasard
                    trickToLearn = tricksInProgress[Math.floor(Math.random() * tricksInProgress.length)];
                } else {
                    const availableToLearn = tricksNotStarted.filter(trick => canLearnTrick(trick));
                    
                    if (availableToLearn.length > 0) {
                        const requiredByOthers = availableToLearn.filter(trick => isRequiredByOtherTricks(trick.id));
                        const priorityTricks = availableToLearn.filter(trick => trick.isPriority);
                        
                        // Fusionner requis + prioritaires (sans doublons) et choisir au hasard
                        const preferredTricks = [...new Map(
                            [...requiredByOthers, ...priorityTricks].map(t => [t.id, t])
                        ).values()];
                        
                        if (preferredTricks.length > 0) {
                            trickToLearn = preferredTricks[Math.floor(Math.random() * preferredTricks.length)];
                        } else {
                            trickToLearn = availableToLearn[Math.floor(Math.random() * availableToLearn.length)];
                        }
                    }
                }

                if (trickToLearn) {
                    tasksToWork.push({
                        type: 'trick_learning',
                        trickId: trickToLearn.id,
                        trickName: trickToLearn.name,
                        name: `Apprentissage du tour: ${trickToLearn.name}`,
                        pathNames: [`Apprentissage du tour`],
                        currentStatus: trickToLearn.learningStatus
                    });
                }

                // 2. Ajouter 3 objectifs à travailler (UNIQUEMENT depuis tours appris)
                if (tricksLearned.length > 0) {
                    const shuffled = [...tricksLearned].sort(() => 0.5 - Math.random());
                    const selectedTricks = shuffled.slice(0, Math.min(3, shuffled.length));

                    selectedTricks.forEach(trick => {
                        const rootObjectives = getRootObjectives(trick.subgoals);
                        
                        if (rootObjectives.length > 0) {
                            const randomObjective = rootObjectives[Math.floor(Math.random() * rootObjectives.length)];
                            const firstIncompleteSubtask = randomObjective.incompleteSubtasks[0];

                            const getPathNames = (subgoals, path, currentPath = []) => {
                                for (const subgoal of subgoals) {
                                    const newPath = [...currentPath, subgoal.name];
                                    if (subgoal.id === path[currentPath.length]) {
                                        if (currentPath.length === path.length - 1) {
                                            return newPath;
                                        }
                                        if (subgoal.children) {
                                            return getPathNames(subgoal.children, path, newPath);
                                        }
                                    }
                                }
                                return currentPath;
                            };

                            const pathNames = getPathNames(trick.subgoals, firstIncompleteSubtask.path);

                            tasksToWork.push({
                                type: 'objective',
                                trickId: trick.id,
                                trickName: trick.name,
                                path: firstIncompleteSubtask.path,
                                name: firstIncompleteSubtask.name,
                                pathNames: pathNames,
                                objectiveName: randomObjective.objective.name
                            });
                        }
                    });
                }

                // 3. Ajouter 1 exercice d'auto-contrôle
                if (selfControlExercises.length > 0) {
                    const exercisesWithIncomplete = selfControlExercises.filter(exercise => {
                        return exercise.subgoals.some(subgoal => !subgoal.completed);
                    });

                    if (exercisesWithIncomplete.length > 0) {
                        const randomExercise = exercisesWithIncomplete[Math.floor(Math.random() * exercisesWithIncomplete.length)];
                        
                        // Prendre la première tâche de niveau racine non complétée
                        const firstIncompleteTask = randomExercise.subgoals.find(subgoal => !subgoal.completed);
                        
                        if (firstIncompleteTask) {
                            tasksToWork.push({
                                type: 'self_control',
                                exerciseId: randomExercise.id,
                                exerciseName: randomExercise.name,
                                path: [firstIncompleteTask.id],
                                name: firstIncompleteTask.name,
                                pathNames: [firstIncompleteTask.name]
                            });
                        }
                    }
                }

                if (tasksToWork.length === 0) {
                    setGeneratedSession({
                        tasks: [],
                        message: "Aucun tour à travailler ! 🎉"
                    });
                    setShowSession(true);
                    return;
                }

                setGeneratedSession({
                    tasks: tasksToWork,
                    message: "Séance d'entraînement personnalisée"
                });
                
                setSessionResults(tasksToWork.map(task => ({
                    ...task,
                    completed: false
                })));
                
                setSessionInProgress(false);
                setShowSession(true);
            };

            const toggleSessionResult = (index) => {
                setSessionResults(sessionResults.map((result, i) => 
                    i === index ? { ...result, completed: !result.completed } : result
                ));
            };

            const finishSession = () => {
                // Appliquer les résultats aux tours
                sessionResults.forEach(result => {
                    if (result.type === 'trick_learning') {
                        // Gérer le changement d'état d'apprentissage du tour
                        if (result.completed) {
                            setTricks(prevTricks => prevTricks.map(trick => {
                                if (trick.id === result.trickId) {
                                    // Si c'était non appris, passer à en cours
                                    if (trick.learningStatus === 'non_appris') {
                                        return { ...trick, learningStatus: 'en_cours' };
                                    }
                                    // Si c'était en cours et validé, passer à appris
                                    if (trick.learningStatus === 'en_cours') {
                                        return { ...trick, learningStatus: 'appris' };
                                    }
                                }
                                return trick;
                            }));
                        }
                    } else if (result.type === 'objective') {
                        // Gérer la validation des objectifs
                        if (result.completed) {
                            setTricks(prevTricks => prevTricks.map(trick => {
                                if (trick.id === result.trickId) {
                                    // Mettre à jour la sous-tâche
                                    const updatedSubgoals = updateSubgoalInPath(trick.subgoals, result.path, { completed: true });
                                    // Auto-cocher les objectifs parents si toutes les sous-tâches sont complétées
                                    const finalSubgoals = autoCheckParents(updatedSubgoals);
                                    return {
                                        ...trick,
                                        subgoals: finalSubgoals
                                    };
                                }
                                return trick;
                            }));
                        }
                    } else if (result.type === 'self_control') {
                        // Gérer la validation des exercices d'auto-contrôle
                        if (result.completed) {
                            setSelfControlExercises(prevExercises => prevExercises.map(exercise => {
                                if (exercise.id === result.exerciseId) {
                                    const updatedSubgoals = updateSubgoalInPath(exercise.subgoals, result.path, { completed: true });
                                    const finalSubgoals = autoCheckParents(updatedSubgoals);
                                    return {
                                        ...exercise,
                                        subgoals: finalSubgoals
                                    };
                                }
                                return exercise;
                            }));
                        }
                    }
                });
                
                // Réinitialiser la séance
                setSessionInProgress(false);
                setShowSession(false);
                setGeneratedSession(null);
                setSessionResults([]);
            };

            const cancelSession = () => {
                setSessionInProgress(false);
                setShowSession(false);
                setGeneratedSession(null);
                setSessionResults([]);
            };

            // Export / Import
            const exportData = () => {
                const data = {
                    tricks,
                    selfControlExercises,
                    exportDate: new Date().toISOString(),
                    version: '1.0'
                };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `vanya-backup-${new Date().toLocaleDateString('fr-FR').replace(/\//g, '-')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        const newTricks = data.tricks || [];
                        const newExercises = data.selfControlExercises || [];
                        setTricks(newTricks);
                        setSelfControlExercises(newExercises);
                        // Sauvegarde immédiate dans Supabase
                        await saveToSupabase(newTricks, newExercises);
                        alert('✅ Données importées et sauvegardées avec succès !');
                    } catch (err) {
                        alert('❌ Erreur lors de l\'import. Vérifiez que le fichier est valide.');
                    }
                };
                reader.readAsText(file);
                // Réinitialiser l'input pour permettre de ré-importer le même fichier
                e.target.value = '';
            };

            // Dashboard View
            const DashboardView = () => {
                // Exclure les tours non appris du calcul de progression globale
                const tricksToCount = tricks.filter(t => t.learningStatus !== 'non_appris');
                const totalSubgoals = tricksToCount.reduce((sum, trick) => sum + countAllSubgoals(trick.subgoals), 0);
                const completedSubgoals = tricksToCount.reduce((sum, trick) => sum + countCompletedSubgoals(trick.subgoals), 0);
                const globalProgress = totalSubgoals > 0 ? Math.round((completedSubgoals / totalSubgoals) * 100) : 0;

                const tricksInProgress = tricks.filter(t => t.learningStatus === 'en_cours').length;
                const tricksLearned = tricks.filter(t => t.learningStatus === 'appris').length;
                const tricksNotStarted = tricks.filter(t => t.learningStatus === 'non_appris').length;

                return (
                    <div className="p-4 md:p-6 space-y-6">
                        <div className="flex justify-between items-center">
                            <h1 className="text-2xl md:text-3xl font-bold text-gray-800">📊 Tableau de Bord</h1>
                            <div className="flex gap-2">
                                <button
                                    onClick={exportData}
                                    className="bg-green-600 text-white px-3 py-2 rounded-lg hover:bg-green-700 transition text-sm shadow-md"
                                    title="Exporter les données"
                                >
                                    💾 Export
                                </button>
                                <label className="bg-blue-600 text-white px-3 py-2 rounded-lg hover:bg-blue-700 transition text-sm shadow-md cursor-pointer"
                                    title="Importer les données"
                                >
                                    📂 Import
                                    <input
                                        type="file"
                                        accept=".json"
                                        onChange={importData}
                                        className="hidden"
                                    />
                                </label>
                                <button
                                    onClick={() => supabase.auth.signOut()}
                                    className="bg-gray-200 text-gray-600 px-3 py-2 rounded-lg hover:bg-gray-300 transition text-sm shadow-md"
                                    title="Se déconnecter"
                                >
                                    🚪
                                </button>
                            </div>
                        </div>

                        {tricks.length === 0 ? (
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-8 text-center">
                                <p className="text-gray-600 text-lg mb-4">🐕 Aucun tour enregistré</p>
                                <p className="text-gray-500">Ajoutez votre premier tour pour commencer !</p>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                {/* Progression globale */}
                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-4">Progression globale</h2>
                                    
                                    <div className="mb-6">
                                        <div className="flex justify-end items-center mb-2">
                                            <span className="text-4xl font-bold text-purple-600">
                                                {globalProgress}%
                                            </span>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-8">
                                            <div
                                                className="progress-bar bg-gradient-to-r from-purple-500 to-pink-500 h-8 rounded-full transition-all duration-500"
                                                style={{ width: `${globalProgress}%` }}
                                            />
                                        </div>
                                    </div>

                                    {/* Statistiques */}
                                    <div className="grid grid-cols-3 gap-4 mb-6">
                                        <div className="bg-gray-50 rounded-lg p-4 text-center">
                                            <div className="text-2xl font-bold text-gray-600">{tricksNotStarted}</div>
                                            <div className="text-xs text-gray-500 mt-1">Non appris</div>
                                        </div>
                                        <div className="bg-blue-50 rounded-lg p-4 text-center">
                                            <div className="text-2xl font-bold text-blue-600">{tricksInProgress}</div>
                                            <div className="text-xs text-gray-500 mt-1">En cours</div>
                                        </div>
                                        <div className="bg-green-50 rounded-lg p-4 text-center">
                                            <div className="text-2xl font-bold text-green-600">{tricksLearned}</div>
                                            <div className="text-xs text-gray-500 mt-1">Appris</div>
                                        </div>
                                    </div>

                                    <div className="text-center text-sm text-gray-600 mb-4">
                                        Total: {tricks.length} tour{tricks.length > 1 ? 's' : ''}
                                    </div>

                                    {/* Bouton générer séance */}
                                    <button
                                        onClick={generateSession}
                                        className="w-full bg-purple-600 text-white px-6 py-4 rounded-lg hover:bg-purple-700 transition shadow-md text-lg font-semibold"
                                    >
                                        🎯 Générer une séance d'entraînement
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // Detail View
            const DetailView = () => {
                if (!selectedTrick) return null;

                const SubgoalItem = ({ subgoal, path, level = 0, index, parentPath, totalSiblings }) => {
                    const isEditing = editingSubgoal && pathsMatch(editingSubgoal, path);
                    const hasChildren = subgoal.children && subgoal.children.length > 0;
                    const expanded = isExpanded(path);
                    
                    const handleDragStart = (e) => {
                        setDraggedItem({ path, index, parentPath });
                        e.dataTransfer.effectAllowed = 'move';
                    };

                    const handleDragOver = (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                    };

                    const handleDrop = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        if (!draggedItem) return;
                        
                        // Vérifier que c'est le même parent
                        const sameParent = (draggedItem.parentPath === null && parentPath === null) ||
                            (draggedItem.parentPath && parentPath && pathsMatch(draggedItem.parentPath, parentPath));
                        
                        if (sameParent && draggedItem.index !== index) {
                            reorderSubgoals(selectedTrick.id, parentPath, draggedItem.index, index);
                        }
                        
                        setDraggedItem(null);
                    };

                    const handleDragEnd = () => {
                        setDraggedItem(null);
                    };
                    
                    return (
                        <div className={`${level > 0 ? 'ml-6 mt-2' : ''}`}>
                            <div 
                                className="flex items-center justify-between bg-gray-50 p-3 md:p-4 rounded-lg hover:bg-gray-100 transition"
                                draggable={!isEditing}
                                onDragStart={handleDragStart}
                                onDragOver={handleDragOver}
                                onDrop={handleDrop}
                                onDragEnd={handleDragEnd}
                            >
                                <div className="flex items-center flex-1">
                                    {hasChildren && (
                                        <button
                                            onClick={() => toggleExpanded(path)}
                                            className="mr-2 text-gray-500 hover:text-gray-700 focus:outline-none"
                                        >
                                            {expanded ? '▼' : '▶'}
                                        </button>
                                    )}
                                    <input
                                        type="checkbox"
                                        checked={subgoal.completed}
                                        onChange={() => toggleSubgoal(selectedTrick.id, path)}
                                        className="w-5 h-5 text-purple-600 rounded cursor-pointer flex-shrink-0"
                                    />
                                    {isEditing ? (
                                        <input
                                            type="text"
                                            value={editingText}
                                            onChange={(e) => setEditingText(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') saveEditSubgoal(selectedTrick.id, path);
                                                if (e.key === 'Escape') cancelEditSubgoal();
                                            }}
                                            className="ml-3 flex-1 border border-purple-300 rounded px-2 py-1 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                            autoFocus
                                        />
                                    ) : (
                                        <span 
                                            className={`ml-3 flex-1 cursor-move ${subgoal.completed ? 'line-through text-gray-400' : 'text-gray-700'}`}
                                            onDoubleClick={() => startEditSubgoal(path, subgoal.name)}
                                        >
                                            {subgoal.name}
                                        </span>
                                    )}
                                </div>
                                <div className="flex items-center gap-2 ml-2">
                                    {isEditing ? (
                                        <>
                                            <button
                                                onClick={() => saveEditSubgoal(selectedTrick.id, path)}
                                                className="text-green-600 hover:text-green-800 text-sm px-2"
                                            >
                                                ✓
                                            </button>
                                            <button
                                                onClick={cancelEditSubgoal}
                                                className="text-gray-600 hover:text-gray-800 text-sm px-2"
                                            >
                                                ✕
                                            </button>
                                        </>
                                    ) : (
                                        <>
                                            <button
                                                onClick={() => startEditSubgoal(path, subgoal.name)}
                                                className="text-blue-500 hover:text-blue-700 text-sm px-2"
                                                title="Modifier"
                                            >
                                                ✏️
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setAddingSubgoalToParent(path);
                                                    setShowAddSubgoal(true);
                                                }}
                                                className="text-green-600 hover:text-green-800 text-sm px-2"
                                                title="Ajouter une sous-tâche"
                                            >
                                                +
                                            </button>
                                            <button
                                                onClick={() => deleteSubgoal(selectedTrick.id, path)}
                                                className="text-red-500 hover:text-red-700 text-sm px-2"
                                                title="Supprimer"
                                            >
                                                🗑️
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                            
                            {hasChildren && expanded && (
                                <div className="space-y-2 mt-2">
                                    {subgoal.children.map((child, idx) => (
                                        <SubgoalItem 
                                            key={child.id} 
                                            subgoal={child} 
                                            path={[...path, child.id]}
                                            level={level + 1}
                                            index={idx}
                                            parentPath={path}
                                            totalSiblings={subgoal.children.length}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                };
                
                return (
                    <div className="p-4 md:p-6 space-y-6">
                        <button
                            onClick={() => window.history.back()}
                            className="text-purple-600 hover:text-purple-800 font-medium mb-4"
                        >
                            ← Retour
                        </button>

                        <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
                            <div className="flex justify-between items-start mb-4">
                                <div className="flex-1">
                                    <div className="flex items-center gap-2 mb-2">
                                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800">
                                            {selectedTrick.name}
                                        </h2>
                                        {selectedTrick.isPriority && (
                                            <span className="text-2xl" title="Tour prioritaire">⭐</span>
                                        )}
                                    </div>
                                    <div className="flex flex-wrap gap-2 items-center">
                                        <select
                                            value={selectedTrick.learningStatus || 'non_appris'}
                                            onChange={(e) => changeLearningStatus(selectedTrick.id, e.target.value)}
                                            className="px-3 py-1 text-sm rounded border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        >
                                            <option value="non_appris">Non appris</option>
                                            <option value="en_cours">En cours</option>
                                            <option value="appris">Appris</option>
                                        </select>
                                        
                                        <button
                                            onClick={() => togglePriority(selectedTrick.id)}
                                            className={`px-3 py-1 text-sm rounded border ${
                                                selectedTrick.isPriority 
                                                    ? 'bg-yellow-100 border-yellow-300 text-yellow-700' 
                                                    : 'bg-gray-100 border-gray-300 text-gray-600'
                                            }`}
                                        >
                                            {selectedTrick.isPriority ? '⭐ Prioritaire' : '☆ Marquer prioritaire'}
                                        </button>
                                    </div>
                                    
                                    {/* Affichage des tours requis */}
                                    {selectedTrick.requiredTricks && selectedTrick.requiredTricks.length > 0 && (
                                        <div className="mt-3 bg-blue-50 border border-blue-200 rounded p-3">
                                            <p className="text-sm font-medium text-blue-800 mb-1">🔗 Tours requis :</p>
                                            <div className="flex flex-wrap gap-1">
                                                {selectedTrick.requiredTricks.map(reqId => {
                                                    const reqTrick = tricks.find(t => t.id === reqId);
                                                    if (!reqTrick) return null;
                                                    return (
                                                        <span 
                                                            key={reqId} 
                                                            className={`text-xs px-2 py-1 rounded ${
                                                                reqTrick.learningStatus === 'appris' 
                                                                    ? 'bg-green-100 text-green-700' 
                                                                    : 'bg-red-100 text-red-700'
                                                            }`}
                                                        >
                                                            {reqTrick.name} {reqTrick.learningStatus === 'appris' ? '✓' : '✗'}
                                                        </span>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="relative edit-menu-container">
                                    <button
                                        onClick={() => setShowEditMenu(!showEditMenu)}
                                        className="text-gray-600 hover:text-gray-800 p-2"
                                        title="Options"
                                    >
                                        ⋮
                                    </button>
                                    {showEditMenu && (
                                        <div className="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-10">
                                            <button
                                                onClick={() => {
                                                    startEditTrickName();
                                                    setShowEditMenu(false);
                                                }}
                                                className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm"
                                            >
                                                ✏️ Modifier le nom
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setShowRequiredTricksModal(true);
                                                    setShowEditMenu(false);
                                                }}
                                                className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm"
                                            >
                                                🔗 Gérer les prérequis
                                            </button>
                                            <button
                                                onClick={() => {
                                                    duplicateTrick(selectedTrick.id);
                                                    setShowEditMenu(false);
                                                }}
                                                className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm"
                                            >
                                                📋 Dupliquer
                                            </button>
                                            <button
                                                onClick={() => {
                                                    deleteTrick(selectedTrick.id);
                                                    setShowEditMenu(false);
                                                }}
                                                className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm text-red-600"
                                            >
                                                🗑️ Supprimer
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="mb-6">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-gray-600">Progression globale</span>
                                    <span className="text-2xl font-bold text-purple-600">
                                        {calculateProgress(selectedTrick)}%
                                    </span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-4">
                                    <div
                                        className="progress-bar bg-gradient-to-r from-purple-500 to-pink-500 h-4 rounded-full"
                                        style={{ width: `${calculateProgress(selectedTrick)}%` }}
                                    />
                                </div>
                                <div className="text-xs text-gray-500 mt-1">
                                    {countCompletedSubgoals(selectedTrick.subgoals)}/{countAllSubgoals(selectedTrick.subgoals)} objectifs complétés
                                </div>
                            </div>

                            <div className="border-t pt-4">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-semibold text-gray-800">
                                        Objectifs ({countAllSubgoals(selectedTrick.subgoals)})
                                    </h3>
                                    <button
                                        onClick={() => {
                                            setAddingSubgoalToParent(null);
                                            setShowAddSubgoal(true);
                                        }}
                                        className="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition text-sm"
                                    >
                                        + Ajouter
                                    </button>
                                </div>

                                {selectedTrick.subgoals.length === 0 ? (
                                    <div className="bg-gray-50 border border-gray-200 rounded-lg p-6 text-center">
                                        <p className="text-gray-500">Aucun objectif défini</p>
                                        <p className="text-xs text-gray-400 mt-1">Double-cliquez pour modifier • Glissez-déposez pour réorganiser</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        <p className="text-xs text-gray-400 mb-3">💡 Double-cliquez pour modifier • Glissez pour réorganiser • ▶ pour déplier • + pour ajouter une sous-tâche</p>
                                        {selectedTrick.subgoals.map((subgoal, index) => (
                                            <SubgoalItem 
                                                key={subgoal.id} 
                                                subgoal={subgoal} 
                                                path={[subgoal.id]}
                                                index={index}
                                                parentPath={null}
                                                totalSiblings={selectedTrick.subgoals.length}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            // Tricks List View
            const TricksListView = () => {
                const searchInputRef = useRef(null);
                const filteredTricks = tricks.filter(trick => 
                    trick.name.toLowerCase().includes(searchQuery.toLowerCase())
                );

                const handleSearchChange = (e) => {
                    setSearchQuery(e.target.value);
                    // Maintenir le focus sur le champ de recherche
                    if (searchInputRef.current) {
                        setTimeout(() => {
                            searchInputRef.current.focus();
                        }, 0);
                    }
                };

                const getStatusColor = (status) => {
                    switch(status) {
                        case 'non_appris': return 'bg-gray-100 text-gray-600';
                        case 'en_cours': return 'bg-blue-100 text-blue-600';
                        case 'appris': return 'bg-green-100 text-green-600';
                        default: return 'bg-gray-100 text-gray-600';
                    }
                };

                const getStatusLabel = (status) => {
                    switch(status) {
                        case 'non_appris': return 'Non appris';
                        case 'en_cours': return 'En cours';
                        case 'appris': return 'Appris';
                        default: return 'Non appris';
                    }
                };

                return (
                    <div className="p-4 md:p-6 space-y-4">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <h1 className="text-2xl md:text-3xl font-bold text-gray-800">📚 Mes Tours</h1>
                            <button
                                onClick={() => setShowAddTrick(true)}
                                className="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition shadow-md"
                            >
                                + Nouveau tour
                            </button>
                        </div>

                        {/* Barre de recherche */}
                        <div className="relative">
                            <input
                                ref={searchInputRef}
                                type="text"
                                placeholder="Rechercher un tour..."
                                value={searchQuery}
                                onChange={handleSearchChange}
                                className="w-full border border-gray-300 rounded-lg px-4 py-2 pl-10 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                autoComplete="off"
                                autoCorrect="off"
                                autoCapitalize="off"
                                spellCheck="false"
                            />
                            <span className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                                🔍
                            </span>
                            {searchQuery && (
                                <button
                                    onClick={() => {
                                        setSearchQuery('');
                                        if (searchInputRef.current) {
                                            searchInputRef.current.focus();
                                        }
                                    }}
                                    className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                >
                                    ✕
                                </button>
                            )}
                        </div>

                        {filteredTricks.length === 0 ? (
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-8 text-center">

                                    {searchQuery ? '🔍 Aucun tour trouvé' : '🐕 Aucun tour enregistré'}

                                <p className="text-gray-500">
                                    {searchQuery ? 'Essayez avec un autre terme de recherche' : 'Ajoutez votre premier tour pour commencer !'}

                            </div>

            const SelfControlView = () => {

                                        </div>

                                })}
                            </div>

                    </div>
                );
            };

            // Exercise Detail View (similaire à DetailView mais pour les exercices)
            const ExerciseDetailView = () => {
                if (!selectedExercise) return null;

                const SubgoalItem = ({ subgoal, path, level = 0, index, parentPath, totalSiblings }) => {
                    const isEditing = editingSubgoal && pathsMatch(editingSubgoal, path);
                    const hasChildren = subgoal.children && subgoal.children.length > 0;
                    const expanded = isExpanded(path);
                    
                    const handleDragStart = (e) => {
                        setDraggedItem({ path, index, parentPath });
                        e.dataTransfer.effectAllowed = 'move';
                    };

                    const handleDragOver = (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                    };

                    const handleDrop = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        if (!draggedItem) return;
                        
                        const sameParent = (draggedItem.parentPath === null && parentPath === null) ||
                            (draggedItem.parentPath && parentPath && pathsMatch(draggedItem.parentPath, parentPath));
                        
                        if (sameParent && draggedItem.index !== index) {
                            reorderExerciseSubgoals(selectedExercise.id, parentPath, draggedItem.index, index);
                        }
                        
                        setDraggedItem(null);
                    };

                    const handleDragEnd = () => {
                        setDraggedItem(null);
                    };
                    
                    return (
                        <div className={`${level > 0 ? 'ml-6 mt-2' : ''}`}>
                            <div 
                                className="flex items-center justify-between bg-gray-50 p-3 md:p-4 rounded-lg hover:bg-gray-100 transition"
                                draggable={!isEditing}
                                onDragStart={handleDragStart}
                                onDragOver={handleDragOver}
                                onDrop={handleDrop}
                                onDragEnd={handleDragEnd}
                            >
                                <div className="flex items-center flex-1">
                                    {hasChildren && (
                                        <button
                                            onClick={() => toggleExpanded(path)}
                                            className="mr-2 text-gray-500 hover:text-gray-700 focus:outline-none"
                                        >
                                            {expanded ? '▼' : '▶'}
                                        </button>
                                    )}
                                    <input
                                        type="checkbox"
                                        checked={subgoal.completed}
                                        onChange={() => toggleExerciseSubgoal(selectedExercise.id, path)}
                                        className="w-5 h-5 text-purple-600 rounded cursor-pointer flex-shrink-0"
                                    />
                                    {isEditing ? (
                                        <input
                                            type="text"
                                            value={editingText}
                                            onChange={(e) => setEditingText(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') saveEditExerciseSubgoal(selectedExercise.id, path);
                                                if (e.key === 'Escape') cancelEditSubgoal();
                                            }}
                                            className="ml-3 flex-1 border border-purple-300 rounded px-2 py-1 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                            autoFocus
                                        />
                                    ) : (
                                        <span 
                                            className={`ml-3 flex-1 cursor-move ${subgoal.completed ? 'line-through text-gray-400' : 'text-gray-700'}`}
                                            onDoubleClick={() => startEditSubgoal(path, subgoal.name)}
                                        >
                                            {subgoal.name}
                                        </span>
                                    )}
                                </div>
                                <div className="flex items-center gap-2 ml-2">
                                    {isEditing ? (
                                        <>
                                            <button
                                                onClick={() => saveEditExerciseSubgoal(selectedExercise.id, path)}
                                                className="text-green-600 hover:text-green-800 text-sm px-2"
                                            >
                                                ✓
                                            </button>
                                            <button
                                                onClick={cancelEditSubgoal}
                                                className="text-gray-600 hover:text-gray-800 text-sm px-2"
                                            >
                                                ✕
                                            </button>
                                        </>
                                    ) : (
                                        <>
                                            <button
                                                onClick={() => startEditSubgoal(path, subgoal.name)}
                                                className="text-blue-500 hover:text-blue-700 text-sm px-2"
                                                title="Modifier"
                                            >
                                                ✏️
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setAddingSubgoalToParent(path);
                                                    setShowAddSubgoal(true);
                                                }}
                                                className="text-green-600 hover:text-green-800 text-sm px-2"
                                                title="Ajouter une sous-tâche"
                                            >
                                                +
                                            </button>
                                            <button
                                                onClick={() => deleteExerciseSubgoal(selectedExercise.id, path)}
                                                className="text-red-500 hover:text-red-700 text-sm px-2"
                                                title="Supprimer"
                                            >
                                                🗑️
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                            
                            {hasChildren && expanded && (
                                <div className="space-y-2 mt-2">
                                    {subgoal.children.map((child, idx) => (
                                        <SubgoalItem 
                                            key={child.id} 
                                            subgoal={child} 
                                            path={[...path, child.id]}
                                            level={level + 1}
                                            index={idx}
                                            parentPath={path}
                                            totalSiblings={subgoal.children.length}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                };
                
                return (
                    <div className="p-4 md:p-6 space-y-6">
                        <button
                            onClick={() => window.history.back()}

                            ← Retour
                        </button>

                            <div className="flex justify-between items-start mb-4">
                                <div className="flex-1">
                                    <div className="flex items-center gap-2 mb-2">
                                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800">
                                            {selectedExercise.name}
                                        </h2>
                                    </div>
                                </div>
                                <div className="relative edit-menu-container">
                                    <button
                                        onClick={() => setShowEditMenu(!showEditMenu)}
                                        className="text-gray-600 hover:text-gray-800 p-2"
                                        title="Options"
                                    >
                                        ⋮
                                    </button>
                                    {showEditMenu && (
                                        <div className="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-10">
                                            <button
                                                onClick={() => {
                                                    startEditExerciseName();
                                                    setShowEditMenu(false);
                                                }}
                                                className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm"
                                            >
                                                ✏️ Modifier le nom
                                            </button>
                                            <button
                                                onClick={() => {
                                                    duplicateExercise(selectedExercise.id);
                                                    setShowEditMenu(false);
                                                }}
                                                className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm"
                                            >
                                                📋 Dupliquer
                                            </button>
                                            <button
                                                onClick={() => {
                                                    deleteExercise(selectedExercise.id);
                                                    setShowEditMenu(false);
                                                }}
                                                className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm text-red-600"
                                            >
                                                🗑️ Supprimer
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="mb-6">
                                <div className="flex justify-end items-center mb-2">
                                    <span className="text-4xl font-bold text-purple-600">
                                        {calculateProgress(selectedExercise)}%
                                    </span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-8">
                                    <div

                                    <button
                                        onClick={() => {

                                            setShowAddSubgoal(true);

                                    </div>

                                    <div className="space-y-2">
                                        <p className="text-xs text-gray-400 mb-3">💡 Double-cliquez pour modifier • Glissez pour réorganiser • ▶ pour déplier • + pour ajouter une sous-tâche</p>
                                        {selectedExercise.subgoals.map((subgoal, index) => (
                                            <SubgoalItem 
                                                key={subgoal.id} 
                                                subgoal={subgoal} 
                                                path={[subgoal.id]}
                                                index={index}
                                                parentPath={null}
                                                totalSiblings={selectedExercise.subgoals.length}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            if (dbLoading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-5xl mb-4">🐕</div>
                            <p className="text-gray-500 text-lg">Chargement de vos données...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50">
                    {/* Navigation */}
                    <nav className="bg-white shadow-md sticky top-0 z-10">
                        <div className="flex justify-around items-center p-3 md:p-4">
                            <button
                                onClick={() => navigateTo('dashboard')}
                                className={`flex flex-col items-center px-3 py-2 rounded-lg transition ${
                                    activeView === 'dashboard' ? 'bg-purple-100 text-purple-700' : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                <span className="text-xl mb-1">📊</span>
                                <span className="text-xs md:text-sm font-medium">Tableau de bord</span>
                            </button>
                            <button
                                onClick={() => navigateTo('tricks')}
                                className={`flex flex-col items-center px-3 py-2 rounded-lg transition ${
                                    activeView === 'tricks' ? 'bg-purple-100 text-purple-700' : 'text-gray-600 hover:bg-gray-100'

                            <button

                                className={`flex flex-col items-center px-3 py-2 rounded-lg transition ${
                                    activeView === 'selfcontrol' ? 'bg-purple-100 text-purple-700' : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                <span className="text-xl mb-1">🧘</span>
                                <span className="text-xs md:text-sm font-medium">Auto-contrôle</span>
                            </button>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-4xl mx-auto pb-20">

                        {activeView === 'tricks' && <TricksListView />}

                    {/* Modal: Required Tricks */}
                    {showRequiredTricksModal && selectedTrick && (
